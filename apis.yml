name: Skycatch
description: 'Skycatch built spatial data capture, processing, and analytics for mining
  and construction sites, turning drone and aerial imagery into high-precision 3D
  data, volumetrics, and AI-driven site insights. Its products included Spatial Sight,
  Spatial DataHub (datahub.skycatch.com), and EdgeServer for on-site edge processing.
  Skycatch was acquired by Caterpillar Inc. on July 7, 2026 (following Caterpillar''s
  RPMGlobal acquisition) to expand its mining technology capabilities. A developer
  platform exists at docs.skycatch.com but is password-gated, and no public API specification
  is available. Originally surfaced as a GV (Google Ventures) portfolio company.'
